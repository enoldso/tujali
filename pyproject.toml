[project]
name = "tujali"
version = "2.0.0"
description = "Specialist care and outbreak early warning over USSD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1",
    "Flask-Login>=0.6.3",
    "Flask-WTF>=1.2.2",
    "WTForms>=3.2.1",
    "email-validator>=2.2.0",
    "Flask-SQLAlchemy>=3.1.1",
    "SQLAlchemy>=2.0",
    "Flask-Migrate>=4.0",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.0",
    "gunicorn>=23.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
