{% extends 'layout_public.html' %}
{% block title %}{{ title }} · Tujali{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="text-center" style="max-width:460px">
    <div class="display-4 fw-bold" style="color:var(--tj-primary)">{{ code }}</div>
    <h1 class="h3 mt-2">{{ title }}</h1>
    <p class="text-muted">{{ message }}</p>
    <a class="btn btn-primary mt-2" href="{{ url_for('auth.home') if current_user.is_authenticated else url_for('public.index') }}">Go back</a>
  </div>
</div>
{% endblock %}
